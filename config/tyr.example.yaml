# Tyr file configuration, schema version 1.
# Changes are loaded only when the process starts; restart Tyr to apply them.
version: 1

server:
  port: 8787
  maxRequestBodyBytes: 1048576
  maxOutputTokens: 200000

# Configure at least one provider-shaped upstream. Tyr forwards the caller's
# supported provider authentication headers; API keys do not belong here.
upstreams:
  anthropic:
    baseUrl: https://api.anthropic.com
  openai:
    baseUrl: https://api.openai.com

timeouts:
  # Maximum wait for upstream response headers. Omit for no timeout.
  responseHeadersMs: 30000
  # Maximum gap between streaming response chunks. Omit for no timeout.
  streamIdleMs: 30000
  # Maximum wait for a backpressured client to drain. When omitted, this
  # defaults to streamIdleMs in the gateway.
  clientStallMs: 30000

shutdown:
  # Uses async-bulkhead-llm v3.9 bounded drain. At the deadline Tyr reports
  # outstanding work and closes remaining HTTP connections. Omit to wait
  # indefinitely, preserving the previous behavior.
  drainTimeoutMs: 30000

priority:
  # Keep false unless a trusted proxy strips client copies of x-priority and
  # injects an authenticated value.
  trustHeader: false

pools:
  - name: interactive-claude
    # Longest model-prefix match wins across all pools.
    modelPrefixes:
      - claude-sonnet-4
      - claude-haiku-4
    # Used by the admission estimator; it does not rewrite the requested model.
    estimatorModel: claude-sonnet-4-5
    maxConcurrent: 40
    # enforce: reject overload. observe: record the same decision but proxy
    # capacity rejections upstream, allowing a safe shadow-mode rollout.
    admissionMode: enforce
    # Omit to disable token-budget admission, use 0 to admit no budget-gated
    # work, or set a positive in-flight token ceiling.
    inFlightTokenBudget: 400000
    # Reserves token headroom for priority=high; it does not reserve a
    # concurrency slot and does not preempt running work.
    highPriorityTokenReserve: 80000
    # Used when the request does not specify max_tokens/max_completion_tokens.
    defaultOutputReservation: 8192
    # Fixed surcharge per opaque image/audio/document/file/video block.
    # Omit for the conservative default of 2048; set 0 to disable it.
    opaqueMediaInputTokenReservation: 2048
    # v3.9 per-model EWMA calibration. Enabled by default for budgeted pools.
    # It learns only from provider-reported input usage and is local/in-memory.
    adaptiveEstimation:
      enabled: true
      smoothing: 0.2
      minSamples: 5
      minCorrection: 0.5
      maxCorrection: 2
      maxModels: 64

  - name: batch-openai
    modelPrefixes:
      - gpt-4o
      - gpt-5
      - o1
      - o3
      - o4
    estimatorModel: gpt-4o
    maxConcurrent: 20
    # Observe first to measure prospective rejections before enforcement.
    admissionMode: observe
    # Omit to bypass all supported capacity reasons. Use [] to observe context
    # without bypassing any rejection.
    shadowReasons: [budget_limit, concurrency_limit]
    inFlightTokenBudget: 250000
    defaultOutputReservation: 4096
